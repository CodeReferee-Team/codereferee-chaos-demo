version: 3
repositories:
  upstream:
    url: https://github.com/CodeReferee-Team/codereferee-chaos-demo.git
    branch: test/redis-reconnect-repair
    commitSha: ca811ac34da40513a26ba8ed2220ee61087e44fa
services:
  gateway:
    buildContext: .
    port: 8000
    healthPath: /health
    dependsOn: [api]
    resources: {cpu: 1000m, memory: 256Mi}
    env:
      READY_DELAY: '0'
      UPSTREAM_URL: '{{service.api.url}}'
  api:
    repository: upstream
    buildContext: .
    port: 8000
    healthPath: /health
    resources: {cpu: 1000m, memory: 256Mi}
    env:
      REDIS_HOST: '{{dependency.redis.host}}'
      REDIS_PORT: '{{dependency.redis.port}}'
dependencies:
  redis:
    type: redis
    probePath: /api/items/1
entryService: gateway
targetService: api
probePath: /api/items/1
probeSpec:
  steps:
    - path: /api/items/1
      expect: {item_id: 1}
